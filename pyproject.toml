[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-agent-web"
version = "0.1.0"
description = "Web/API platform for python-agent-harness: controller, auth, billing, secrets."
authors = [{ name = "Huming Chen", email = "chenhuming@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "docker>=7.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated migration scripts follow the tool's own template
# (old-style typing, its import order); env.py is hand-written and stays linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
